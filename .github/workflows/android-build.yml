name: Android Build

# Builds the Android USSD gateway companion app and publishes the debug APK
# as a downloadable workflow artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two builds of the same branch at the same time.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # AGP 8.7.3 requires Gradle >= 8.9 and JDK 17 (see android/app/build.gradle.kts).
  GRADLE_VERSION: '8.11.1'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  # Fixed signing key committed at android/app/keystore.jks (see
  # android/app/build.gradle.kts). Every APK must carry this signature so an
  # installed copy can be updated in place instead of being uninstalled first.
  KEYSTORE_FILE: 'app/keystore.jks'
  KEYSTORE_ALIAS: 'androiddebugkey'
  KEYSTORE_PASSWORD: 'android'

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Every "run" step below executes inside ./android, which holds the Gradle
    # project (settings.gradle.kts, app module); only action inputs such as the
    # artifact path are resolved from the repository root.
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Confirm the Android project directory
        run: |
          # The job defaults run every step in ./android, so verify the Gradle
          # project is really there instead of failing later inside Gradle.
          test -f settings.gradle.kts || { echo "::error::settings.gradle.kts not found in $(pwd)"; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::app module not found under $(pwd)"; exit 1; }
          echo "Building the Gradle project in $(pwd)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the signing keystore
        run: |
          # The keystore is committed with the repository, so a missing file
          # means the checkout or .gitignore is wrong: stop before Gradle runs.
          test -f "${KEYSTORE_FILE}" || { echo "::error::${KEYSTORE_FILE} not found in $(pwd)"; exit 1; }
          keytool -list -v -keystore "${KEYSTORE_FILE}" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEYSTORE_ALIAS}" \
            | grep -E 'Alias name:|Valid from:|SHA256:' \
            || { echo "::error::Cannot read alias ${KEYSTORE_ALIAS} from ${KEYSTORE_FILE}"; exit 1; }

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Command line tools + platform-tools, plus the SDK licenses are accepted.
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Point the build at the Android SDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at ${SDK_DIR}"
          echo "sdk.dir=${SDK_DIR}" > local.properties
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Pinned to the same Gradle as the GRADLE_VERSION env var above; this
          # command only provides the binary used to generate the wrapper.
          gradle-version: '8.11.1'
          # Cache the wrapper distribution as well, so ./gradlew does not re-download Gradle.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper/dists

      - name: Check the JDK running the build
        run: |
          # AGP 8.7.3 requires JDK 17; make the version visible and enforce it.
          java_version="$(java -version 2>&1 | head -n 1)"
          echo "java: ${java_version}"
          case "${java_version}" in
            *'"17'*) ;;
            *) echo "::error::Expected JDK 17 but the build is using: ${java_version}"; exit 1 ;;
          esac

      - name: Provide the Gradle wrapper
        run: |
          # The wrapper is not committed, so it is generated here on demand. A
          # wrapper that was committed without its jar is repaired as well,
          # because ./gradlew would abort on the missing jar.
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            # Generate the wrapper in a scratch project so this step does not
            # depend on the Android build being configurable yet. Gradle 8
            # refuses to run in a directory that holds no build at all, so the
            # scratch project gets an empty settings file.
            scratch="$(mktemp -d)"
            : > "$scratch/settings.gradle"
            if ! (cd "$scratch" && gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin) > "$scratch/wrapper.log" 2>&1; then
              # Surface the reason as a public annotation, keeping the log short.
              echo "::error title=Gradle wrapper generation failed::$(tail -c 1200 "$scratch/wrapper.log" | tr '\n' ' ' | sed 's/%/%25/g')"
              tail -60 "$scratch/wrapper.log"
              exit 1
            fi
            mkdir -p gradle/wrapper
            cp "$scratch/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            cp "$scratch/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
            cp "$scratch/gradlew" "$scratch/gradlew.bat" .
          fi

          # A fresh checkout drops the executable bit, so restore it before use.
          chmod +x gradlew

          # Prints the Gradle, JVM and Android SDK versions used by the build.
          ./gradlew --version

      - name: Assemble debug APK
        env:
          # Dependency-graph submission needs a write-scoped token; this job stays read-only.
          GITHUB_DEPENDENCY_GRAPH_ENABLED: 'false'
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify the APK signature
        run: |
          # The private key never leaves android/app/keystore.jks, so compare the
          # certificate digests: matching digests prove the APK carries the fixed
          # signature and installs over an existing copy of the app.
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "${apk}" || { echo "::error::${apk} was not produced"; exit 1; }

          apksigner="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          keystore_sha256="$(keytool -list -v -keystore "${KEYSTORE_FILE}" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEYSTORE_ALIAS}" \
            | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ': ' | tr 'A-Z' 'a-z')"
          apk_sha256="$("${apksigner}" verify --print-certs "${apk}" \
            | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr -d ' ' | tr 'A-Z' 'a-z')"

          echo "keystore certificate SHA-256:   ${keystore_sha256}"
          echo "APK signer certificate SHA-256: ${apk_sha256}"
          if [ -z "${keystore_sha256}" ] || [ -z "${apk_sha256}" ]; then
            echo "::error::Could not read a certificate digest from the keystore or the APK"
            exit 1
          fi
          if [ "${keystore_sha256}" != "${apk_sha256}" ]; then
            echo "::error::APK is not signed with android/app/keystore.jks"
            exit 1
          fi

          "${apksigner}" verify --verbose "${apk}"

      - name: Show build output
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
