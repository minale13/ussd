services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: withdrawal
      POSTGRES_USER: withdrawal
      POSTGRES_PASSWORD: withdrawal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U withdrawal -d withdrawal"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"