<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>USSD Gateway Console</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #02060f; color: #e2e8f0;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; color: #00e5c3; }
  p { margin: .35rem 0; color: #94a3b8; font-size: .875rem; }
  a {
    display: inline-block; margin-top: 1.25rem; padding: .7rem 1.4rem;
    border-radius: .75rem; background: #00e5c3; color: #02060f;
    font-weight: 700; text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>USSD Gateway</h1>
  <p>This deployment is a serverless function; this folder exists only so the
     build always finds a static output directory.</p>
  <p>Nothing is served from here in a normal deployment.</p>
  <a href="/admin">Open the admin console</a>
</main>
</body>
</html>
